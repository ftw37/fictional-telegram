<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08110b"><title>Space Invaders · Archive PET edition</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header><p class="eyebrow">COMMODORE PET · INTERNET ARCHIVE EDITION</p><h1>SPACE INVADERS<span>▌</span></h1><p class="subtitle">The original program from PET Games Disk 04.</p></header>
<section class="cabinet" aria-label="Original PET game"><canvas id="game" width="320" height="200" tabindex="0" aria-label="Space Invaders playfield. Arrow keys move, Space fires."></canvas><div class="screen-footer"><span id="status" role="status">ORIGINAL INSTRUCTIONS</span><span>40 × 25</span></div></section>
<div class="commands"><button id="start">BEGIN GAME [B]</button><button id="pause" disabled>PAUSE [P]</button><button id="sound" aria-pressed="false">SOUND OFF</button><button id="instructions">ORIGINAL OPENING SCREEN</button></div>
<p class="controls"><kbd>←</kbd> <kbd>→</kbd> MOVE <span>/</span> <kbd>SPACE</kbd> FIRE <span>/</span> <kbd>P</kbd> PAUSE</p>
<div class="touch"><button id="left" aria-label="Move left">←</button><button id="fire" aria-label="Fire">FIRE</button><button id="right" aria-label="Move right">→</button></div>
<footer><p>Original 6502 game code, original PET character graphics. Browser controls and pause added.</p><a href="https://archive.org/details/d64_petgame_space_invaders" target="_blank" rel="noopener">SOURCE: INTERNET ARCHIVE ↗</a><p id="announcement" class="sr-only" aria-live="polite"></p></footer>
</main><script src="cpu6502.js"></script><script src="data.js"></script><script src="game.js"></script><script src="app.js"></script></body></html>
